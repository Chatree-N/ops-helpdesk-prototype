<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative;box-sizing:border-box;width:100%;min-width:0;overflow:hidden;background:#fff;border:0;border-radius:14px;padding:12px 12px 12px 20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:{{ sh }};transform:{{ tf }};transition:box-shadow 150ms ease,transform 150ms ease;font-family:var(--font,-apple-system,Inter,sans-serif);color:#0F172A">
  <span style="position:absolute;left:8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:{{ accent }}"></span>
  <div style="display:flex;align-items:center;gap:8px;height:24px">
    <span style="font:700 12px/16px var(--mono,ui-monospace,monospace);color:#64748B">{{ id }}</span>
    <span style="margin-left:auto;display:inline-flex"><dc-import name="Pill" kind="tone" value="{{ kymTone }}" label="{{ kym }}" hint-size="70px,20px"></dc-import></span>
    <button data-nodrag="1" onClick="{{ menu }}" aria-label="Card menu" style="width:32px;height:32px;margin:-4px -10px -4px 0;border:0;border-radius:8px;background:transparent;color:#64748B;cursor:pointer;font:700 15px/1 var(--font);letter-spacing:1px;display:flex;align-items:center;justify-content:center;opacity:{{ menuOp }};transition:opacity 150ms ease" style-hover="background:#F1F5F9">···</button>
  </div>
  <div title="{{ name }}" style="font:600 14px/20px var(--font);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ name }}</div>
  <div style="font:400 13px/20px var(--font);color:#64748B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ place }}</div>
  <div style="display:flex;align-items:center;gap:4px 8px;min-height:28px;flex-wrap:wrap">
    <dc-import name="SlaRing" size="28" pct="{{ pct }}" state="{{ state }}" centre="" hint-size="28px,28px"></dc-import>
    <span style="font:500 13px/20px var(--font);color:{{ labelColor }};white-space:nowrap;font-variant-numeric:tabular-nums">{{ label }}</span>
    <sc-if value="{{ mismatch }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto"><dc-import name="Pill" kind="tone" value="red" label="ID mismatch" hint-size="80px,20px"></dc-import></span></sc-if>
    <sc-if value="{{ vendor }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto"><dc-import name="Pill" kind="tone" value="amber" label="Vendor wait" hint-size="80px,20px"></dc-import></span></sc-if>
  </div>
  <div style="display:flex;align-items:center;gap:8px;border-top:1px solid #F1F5F9;padding-top:8px;margin-top:2px">
    <dc-import name="Avatar" initials="{{ ini }}" color="{{ aColor }}" size="24" hint-size="24px,24px"></dc-import>
    <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px/20px var(--font);color:#475569">{{ aName }}</span>
    <span style="font:400 12px/16px var(--font);color:#64748B;white-space:nowrap">{{ rel }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:288,&quot;height&quot;:200},&quot;dealer&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onMenu&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { m: null, hover: false, tick: 0 };
  componentDidMount() { import('./store.js').then((m) => this.setState({ m })); this.iv = setInterval(() => this.setState((s) => ({ tick: s.tick + 1 })), 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const { m, hover } = this.state, p = this.props, d = p.dealer, sel = !!p.selected;
    const base = { onClick: p.onClick || (() => {}), enter: () => this.setState({ hover: true }), leave: () => this.setState({ hover: false }), menu: (e) => { e.stopPropagation(); p.onMenu && p.onMenu(); }, menuOp: hover || p.menuOpen ? 1 : 0,
      sh: sel ? '0 0 0 2px #7C3AED, 0 6px 18px rgba(124,58,237,.12)' : hover ? '0 6px 18px rgba(15,18,32,.08)' : '0 1px 2px rgba(15,18,32,.05), 0 1px 1px rgba(15,18,32,.03)', tf: hover && !sel ? 'translateY(-1px)' : 'none' };
    if (!m || !d) return { ...base, accent: '#CBD5E1', id: '', kym: '', kymTone: 'slate', name: '', place: '', pct: 100, state: 'ok', label: '', labelColor: '#475569', mismatch: false, vendor: false, ini: '', aColor: '#CBD5E1', aName: '', rel: '' };
    const v = m.dealerView(d), a = m.agentById(d.owner), k = m.kymOverall(d), st = m.store.get();
    const last = d.events[d.events.length - 1];
    return { ...base, accent: { breached: '#FF3B30', risk: '#FF9500', ok: '#CBD5E1', done: '#34C759' }[v.state], id: d.id, kym: k, kymTone: { Approved: 'green', Review: 'amber', Rejected: 'red', Pending: 'slate' }[k], name: d.name, place: d.branch + ' · ' + d.region,
      pct: v.pct, state: v.state, label: v.label, labelColor: { breached: '#FF3B30', risk: '#C2410C', done: '#15803D' }[v.state] || '#475569',
      mismatch: m.idParity(d) === 'mismatch' && d.stage < 4, vendor: d.stage < 4 && m.openVendorReqs(d, st).length > 0, ini: a.initials, aColor: a.color, aName: a.name, rel: m.relTime(last ? last.at : d.createdAt) };
  }
}
</script>
</body>
</html>
