<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="box-sizing:border-box;width:100%;background:#fff;position:relative;border:0;border-radius:14px;padding:12px 12px 12px 20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:{{ sh }};transform:{{ tf }};transition:box-shadow 150ms ease,transform 150ms ease,border-color 150ms ease;font-family:var(--font,-apple-system,Inter,sans-serif);color:#0F172A">
  <span style="position:absolute;left:8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:{{ accent }}"></span>
  <div style="display:flex;align-items:center;gap:8px;height:24px">
    <span style="font:700 12px/16px var(--mono,ui-monospace,monospace);color:#64748B">#{{ id }}</span>
    <span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:600 12px/16px var(--font);color:{{ pc }}"><dc-import name="Icon" icon="signal" size="14" stroke="1.75" hint-size="14px,14px"></dc-import>{{ priority }}</span>
    <button data-nodrag="1" onClick="{{ menu }}" aria-label="Card menu" style="width:32px;height:32px;margin:-4px -10px -4px 0;border:0;border-radius:8px;background:transparent;color:#64748B;cursor:pointer;font:700 15px/1 var(--font);letter-spacing:1px;display:flex;align-items:center;justify-content:center;opacity:{{ menuOp }};transition:opacity 150ms ease" style-hover="background:#F1F5F9">···</button>
  </div>
  <div title="{{ subject }}" style="font:600 14px/20px var(--font);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ subject }}</div>
  <div style="display:flex;align-items:center;gap:4px 8px;min-height:28px;flex-wrap:wrap">
    <dc-import name="SlaRing" size="28" pct="{{ pct }}" state="{{ state }}" centre="" hint-size="28px,28px"></dc-import>
    <span style="font:500 13px/20px var(--font);color:{{ labelColor }};white-space:nowrap;font-variant-numeric:tabular-nums">{{ label }}</span>
    <sc-if value="{{ vendor }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;max-width:100%"><dc-import name="Pill" kind="tone" value="amber" label="Vendor wait" hint-size="80px,20px"></dc-import></span></sc-if>
  </div>
  <div style="display:flex;align-items:center;gap:8px;font:400 13px/20px var(--font);color:#64748B;min-width:0;overflow:hidden">
    <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ requester }}</span>
    <span title="{{ channel }}" style="color:#64748B;display:inline-flex"><dc-import name="Icon" icon="{{ chIcon }}" size="16" hint-size="16px,16px"></dc-import></span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;border-top:1px solid #F1F5F9;padding-top:8px;margin-top:2px">
    <dc-import name="Avatar" initials="{{ ini }}" color="{{ aColor }}" size="24" hint-size="24px,24px"></dc-import>
    <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px/20px var(--font);color:#475569">{{ aName }}</span>
    <span style="font:400 12px/16px var(--font);color:#64748B;white-space:nowrap">{{ rel }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:288,&quot;height&quot;:200},&quot;ticket&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onMenu&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { m: null, hover: false, tick: 0 };
  componentDidMount() { import('./store.js').then((m) => this.setState({ m })); this.iv = setInterval(() => this.setState((s) => ({ tick: s.tick + 1 })), 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const { m, hover } = this.state, p = this.props, t = p.ticket, sel = !!p.selected;
    const base = { onClick: p.onClick || (() => {}), enter: () => this.setState({ hover: true }), leave: () => this.setState({ hover: false }),
      menu: (e) => { e.stopPropagation(); p.onMenu && p.onMenu(); }, menuOp: hover || p.menuOpen ? 1 : 0,
      sh: sel ? '0 0 0 2px #7C3AED, 0 6px 18px rgba(124,58,237,.12)' : hover ? '0 6px 18px rgba(15,18,32,.08)' : '0 1px 2px rgba(15,18,32,.05), 0 1px 1px rgba(15,18,32,.03)', tf: hover && !sel ? 'translateY(-1px)' : 'none' };
    const PC = { Urgent: '#D70015', High: '#C93400', Normal: '#0062CC', Low: '#64748B' }, AC = { Urgent: '#FF3B30', High: '#FF9500', Normal: '#007AFF', Low: '#CBD5E1' };
    if (!m || !t) return { ...base, pc: '#64748B', accent: '#CBD5E1', id: '', priority: 'Normal', subject: '', pct: 100, state: 'ok', label: '', labelColor: '#475569', vendor: false, requester: '', channel: '', chIcon: 'mail', ini: '', aColor: '#CBD5E1', aName: '', rel: '' };
    const v = m.slaView(t), a = m.agentById(t.assignee);
    return { ...base, pc: PC[t.priority], accent: AC[t.priority], id: t.id, priority: t.priority, subject: t.subject, pct: v.pct, state: v.state, label: v.label,
      labelColor: { breached: '#FF3B30', risk: '#C2410C', paused: '#8E8E93', done: '#15803D' }[v.state] || '#475569', vendor: !!t.waitingVendor && t.status !== 'Resolved',
      requester: t.requester + ' · ' + t.requesterRole, channel: t.channel, chIcon: { Email: 'mail', LINE: 'chat', Phone: 'phone', Form: 'form' }[t.channel],
      ini: a ? a.initials : '–', aColor: a ? a.color : '#CBD5E1', aName: a ? a.name : 'Unassigned', rel: m.relTime(t.updatedAt) };
  }
}
</script>
</body>
</html>
