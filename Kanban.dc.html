<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes mdFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@keyframes mdUp{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}</style></helmet>
<div style="position:relative;display:flex;height:100%;min-height:0;background:#F8FAFC;font-family:var(--font,-apple-system,Inter,sans-serif);color:#0F172A">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding:16px;gap:12px;position:relative">
    <dc-import name="FilterBar" hint-size="100%,0px"></dc-import>
    <sc-if value="{{ notice }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:10px 16px;font:600 13px/20px var(--font);color:#B91C1C;animation:mdFade 200ms ease"><dc-import name="Icon" icon="alert" size="16" hint-size="16px,16px"></dc-import>{{ notice }}</div></sc-if>
    <sc-if value="{{ boardEmpty }}" hint-placeholder-val="{{ false }}"><div style="flex:1;background:#fff;border:1px solid #E2E8F0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:32px"><div style="width:48px;height:48px;border-radius:14px;background:#F1F5F9;color:#64748B;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="search" size="24" hint-size="24px,24px"></dc-import></div><div style="font:700 17px/24px var(--font)">No tickets match these filters</div><div style="font:400 14px/20px var(--font);color:#64748B">Try a different view or remove a filter.</div><button onClick="{{ clearAll }}" style="margin-top:8px;height:36px;padding:0 16px;border:0;border-radius:10px;background:#7C3AED;color:#fff;font:600 14px/20px var(--font);cursor:pointer" style-hover="background:#6D28D9">Clear filters</button></div></sc-if>
    <div ref="{{ boardRef }}" style="flex:1;min-height:0;display:{{ boardDisplay }};gap:24px;overflow-x:auto;padding-bottom:6px">
      <sc-for list="{{ cols }}" as="c" hint-placeholder-count="5">
        <div data-col="{{ c.key }}" style="flex:1 1 0;min-width:216px;display:flex;flex-direction:column;min-height:0;border-radius:14px;background:{{ c.wrapBg }};outline:{{ c.outline }};outline-offset:2px;transition:background 150ms ease" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}">
          <div style="flex:none;height:32px;display:flex;align-items:center;gap:8px;padding:0 4px"><span style="width:8px;height:8px;border-radius:50%;background:{{ c.dot }}"></span><span style="font:600 12px/16px var(--font);letter-spacing:.06em;color:#475569">{{ c.label }}</span><span style="min-width:22px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#F1F5F9;color:#64748B;display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 var(--font);font-variant-numeric:tabular-nums">{{ c.count }}</span><button onClick="{{ c.add }}" aria-label="Add ticket" style="margin-left:auto;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#64748B;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ c.plusOp }};transition:opacity 150ms ease" style-hover="background:#F1F5F9"><dc-import name="Icon" icon="plus" size="16" stroke="1.75" hint-size="16px,16px"></dc-import></button></div>
          <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px 8px 16px 4px">
            <sc-for list="{{ c.cards }}" as="k" hint-placeholder-count="3">
              <div onPointerDown="{{ k.down }}" style="position:relative;cursor:grab;user-select:none;opacity:{{ k.op }};transition:opacity 150ms ease;flex:none">
                <dc-import name="KCard" ticket="{{ k.ticket }}" selected="{{ k.selected }}" menuOpen="{{ k.menuOpen }}" onClick="{{ k.click }}" onMenu="{{ k.toggleMenu }}" hint-size="100%,190px"></dc-import>
                <sc-if value="{{ k.menuOpen }}" hint-placeholder-val="{{ false }}">
                  <div data-nodrag="1" onClick="{{ k.toggleMenu }}" style="position:fixed;inset:0;z-index:30"></div>
                  <div data-nodrag="1" style="position:absolute;top:36px;right:8px;width:180px;z-index:31;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);padding:6px;animation:mdFade 150ms ease">
                    <div style="font:600 11px/16px var(--font);letter-spacing:.06em;color:#64748B;padding:6px 10px 4px">MOVE TO</div>
                    <sc-for list="{{ k.moves }}" as="mv" hint-placeholder-count="4"><button onClick="{{ mv.go }}" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font:500 13px/20px var(--font);color:#0F172A" style-hover="background:#F5F3FF"><span style="width:8px;height:8px;border-radius:50%;background:{{ mv.dot }}"></span>{{ mv.label }}</button></sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{ c.empty }}" hint-placeholder-val="{{ false }}"><button onClick="{{ c.add }}" style="align-self:flex-start;border:0;background:none;padding:6px 4px;cursor:pointer;font:500 13px/20px var(--font);color:#64748B;border-radius:8px" style-hover="color:#7C3AED">+ Add ticket</button></sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="QuickPanel" hint-size="0px,0px"></dc-import>
  <sc-if value="{{ ghostOn }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;left:{{ ghostX }};top:{{ ghostY }};width:{{ ghostW }};z-index:100;pointer-events:none;transform:rotate(1deg);filter:drop-shadow(0 18px 28px rgba(15,18,32,.28));opacity:.97"><dc-import name="KCard" ticket="{{ ghostTicket }}" selected="{{ true }}" hint-size="100%,190px"></dc-import></div></sc-if>
  <sc-if value="{{ escOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeEsc }}" style="position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:50;display:flex;align-items:center;justify-content:center">
      <div onClick="{{ stop }}" style="width:440px;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.3);padding:24px;display:flex;flex-direction:column;gap:16px;animation:mdFade 200ms ease">
        <div style="font:700 20px/28px var(--font)">Escalate {{ escId }}</div>
        <label style="display:flex;flex-direction:column;gap:6px;font:600 12px/16px var(--font);color:#64748B">Escalate to
          <select onChange="{{ setEscTarget }}" style="height:36px;border:1px solid #E2E8F0;border-radius:10px;padding:0 8px;font:500 14px/20px var(--font);outline:0;background:#fff"><sc-for list="{{ targets }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label>
        <label style="display:flex;flex-direction:column;gap:6px;font:600 12px/16px var(--font);color:#64748B">Reason
          <textarea value="{{ escReason }}" onChange="{{ setEscReason }}" placeholder="What does the next owner need to know?" style="height:96px;resize:none;border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px;font:400 14px/20px var(--font);outline:0;box-sizing:border-box;width:100%"></textarea></label>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button onClick="{{ closeEsc }}" style="height:36px;padding:0 16px;border:1px solid #E2E8F0;border-radius:10px;background:#fff;color:#334155;font:600 14px/20px var(--font);cursor:pointer">Cancel</button>
          <button onClick="{{ doEscalate }}" style="height:36px;padding:0 16px;border:0;border-radius:10px;background:#FF9500;color:#fff;font:600 14px/20px var(--font);cursor:pointer">Escalate</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);font:600 13px/20px var(--font);animation:mdUp 200ms ease;white-space:nowrap"><span style="width:20px;height:20px;border-radius:50%;background:#34C759;color:#fff;display:inline-flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="check" size="12" stroke="2.5" hint-size="12px,12px"></dc-import></span>{{ toastText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  boardRef = React.createRef();
  state = { m: null, s: null, hoverCol: null, tick: 0, drag: null, over: null, menuId: null, esc: null, notice: '' };
  componentDidMount() {
    import('./store.js').then((m) => { this.m = m; this.unsub = m.store.subscribe((s) => this.setState({ s })); this.setState({ m, s: m.store.get() }); });
    this.iv = setInterval(() => { if (!this.pd || !this.pd.active) this.setState((x) => ({ tick: x.tick + 1 })); }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.nt); this.unsub && this.unsub(); window.removeEventListener('pointermove', this.mv); window.removeEventListener('pointerup', this.up); }
  zoom() { return parseFloat(getComputedStyle(document.documentElement).zoom) || 1; }
  down(e, t) {
    if (e.button !== 0 || (e.target.closest && e.target.closest('[data-nodrag]'))) return;
    const r = e.currentTarget.getBoundingClientRect();
    this.pd = { id: t.id, sx: e.clientX, sy: e.clientY, offX: e.clientX - r.left, offY: e.clientY - r.top, w: r.width, active: false };
    window.addEventListener('pointermove', this.mv); window.addEventListener('pointerup', this.up);
  }
  mv = (e) => {
    const pd = this.pd; if (!pd) return;
    if (!pd.active) { if (Math.hypot(e.clientX - pd.sx, e.clientY - pd.sy) < 6) return; pd.active = true; }
    const el = document.elementFromPoint(e.clientX, e.clientY), col = el && el.closest ? el.closest('[data-col]') : null;
    const b = this.boardRef.current;
    if (b) { const r = b.getBoundingClientRect(); if (e.clientX > r.right - 60) b.scrollLeft += 18; else if (e.clientX < r.left + 60) b.scrollLeft -= 18; }
    this.setState({ drag: { id: pd.id, x: e.clientX, y: e.clientY, offX: pd.offX, offY: pd.offY, w: pd.w }, over: col ? col.dataset.col : null });
  };
  up = () => {
    window.removeEventListener('pointermove', this.mv); window.removeEventListener('pointerup', this.up);
    const pd = this.pd; this.pd = null; if (!pd || !pd.active) return;
    this.justDragged = true; setTimeout(() => { this.justDragged = false; }, 60);
    const over = this.state.over; this.setState({ drag: null, over: null });
    if (over) this.moveTo(pd.id, over);
  };
  setNotice(t) { clearTimeout(this.nt); this.setState({ notice: t }); this.nt = setTimeout(() => this.setState({ notice: '' }), 3500); }
  moveTo(id, target) {
    const m = this.m, st = m.store, t = st.get().tickets.find((x) => x.id === id);
    if (!t || t.status === target) return;
    if (target === 'Resolved' && t.verify && t.verify.level === 'High' && !t.verify.checks.every(Boolean)) return this.setNotice('Verification required before resolving');
    if (target === 'Escalated') return this.setState({ esc: { id, target: 'Ops Leader', reason: '' } });
    if (target === 'Resolved') return st.resolve(id);
    st.updateTicket(id, { status: target }); st.toast(id + ' moved to ' + target);
  }
  renderVals() {
    const { m, s, drag, over, menuId, esc, notice, hoverCol } = this.state, nop = () => {};
    const blank = { boardEmpty: false, boardDisplay: 'flex', clearAll: nop, notice: '', boardRef: this.boardRef, cols: [], ghostOn: false, ghostX: '0px', ghostY: '0px', ghostW: '0px', ghostTicket: null, escOpen: false, closeEsc: nop, stop: nop, escId: '', setEscTarget: nop, targets: [], escReason: '', setEscReason: nop, doEscalate: nop, toast: false, toastText: '' };
    if (!m || !s) return blank;
    const st = m.store, z = this.zoom(), all = m.ticketsOfType(s);
    const vis = m.filterTickets(all, { view: s.view, priority: s.priority, query: s.query, me: m.me(s), filters: s.filters });
    const slaKey = (t) => { const v = m.slaView(t); return v.state === 'done' ? 1e9 : v.state === 'paused' ? 1e8 : m.slaClocks(t).active.left; };
    const ordered = [...vis].sort((a, b) => m.PRIO_RANK[a.priority] - m.PRIO_RANK[b.priority] || slaKey(a) - slaKey(b));
    const T = { New: ['#F8FAFC', '#E2E8F0', '#94A3B8', '#475569'], Open: ['#EFF6FF', '#BFDBFE', '#3B82F6', '#1D4ED8'], Pending: ['#FFFBEB', '#FDE68A', '#F2C14E', '#92400E'], Escalated: ['#FAF5FF', '#E9D5FF', '#8B5CF6', '#6D28D9'], Resolved: ['#F0FDF4', '#BBF7D0', '#52B788', '#15803D'] };
    const cols = m.STATUSES.map((k) => {
      const list = ordered.filter((t) => t.status === k);
      return { key: k, label: k.toUpperCase(), count: list.length, dot: T[k][2], empty: list.length === 0, plusOp: hoverCol === k ? 1 : 0, enter: () => this.setState({ hoverCol: k }), leave: () => this.setState({ hoverCol: null }),
        add: () => st.requestNew(k),
        outline: drag ? (over === k ? '2px dashed #A78BFA' : '1.5px dashed #C4B5FD') : 'none', wrapBg: drag ? (over === k ? '#EDE9FE' : '#F5F3FF') : 'transparent',
        cards: list.map((t) => ({ ticket: t, selected: s.selectedId === t.id, op: drag && drag.id === t.id ? 0.3 : 1, down: (e) => this.down(e, t), click: () => { if (!this.justDragged) st.select(s.selectedId === t.id ? null : t.id); },
          menuOpen: menuId === t.id, toggleMenu: () => this.setState({ menuId: menuId === t.id ? null : t.id }),
          moves: m.STATUSES.filter((x) => x !== k).map((x) => ({ label: x, dot: T[x][2], go: () => { this.setState({ menuId: null }); this.moveTo(t.id, x); } })) })) };
    });
    const dt = drag && s.tickets.find((x) => x.id === drag.id);
    return { ...blank, boardEmpty: vis.length === 0, boardDisplay: vis.length === 0 ? 'none' : 'flex', clearAll: () => st.clearFilters(), notice, cols, ghostOn: !!dt, ghostX: dt ? (drag.x - drag.offX) / z + 'px' : '0px', ghostY: dt ? (drag.y - drag.offY) / z + 'px' : '0px', ghostW: dt ? drag.w / z + 'px' : '0px', ghostTicket: dt || null,
      escOpen: !!esc, escId: esc ? esc.id : '', closeEsc: () => this.setState({ esc: null }), stop: (e) => e.stopPropagation(), targets: Object.keys(m.ESCALATION_TARGETS).map((v) => ({ v, sel: esc && esc.target === v })),
      setEscTarget: (e) => this.setState({ esc: { ...esc, target: e.target.value } }), escReason: esc ? esc.reason : '', setEscReason: (e) => this.setState({ esc: { ...esc, reason: e.target.value } }),
      doEscalate: () => { st.escalate(esc.id, { reason: esc.reason, target: esc.target }); this.setState({ esc: null }); }, toast: !!s.toast, toastText: s.toast ? s.toast.text : '' };
  }
}
</script>
</body>
</html>
