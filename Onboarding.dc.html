<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes mdFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@keyframes mdUp{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}</style></helmet>
<div style="position:relative;display:flex;flex-direction:column;height:100%;min-height:0;background:#F8FAFC;font-family:var(--font,-apple-system,Inter,sans-serif);color:#0F172A;padding:16px 16px 0;gap:12px;box-sizing:border-box">
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(260px,1.7fr);gap:12px;flex:none">
    <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4"><div style="background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 1px 2px rgba(15,18,32,.05);min-width:0"><div style="font:500 12px/16px var(--font);color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.label }}</div><div style="font:600 28px/36px var(--font);font-variant-numeric:tabular-nums;color:{{ k.color }}">{{ k.value }}</div></div></sc-for>
    <div style="background:#fff;border-radius:14px;padding:10px 16px;box-shadow:0 1px 2px rgba(15,18,32,.05);min-width:0;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:12px"><span style="font:500 12px/16px var(--font);color:#64748B">Planned vs onboarded</span><span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:500 11px/16px var(--font);color:#64748B"><span style="width:8px;height:8px;border-radius:2px;background:#DDD6FE"></span>Planned</span><span style="display:inline-flex;align-items:center;gap:4px;font:500 11px/16px var(--font);color:#64748B"><span style="width:8px;height:8px;border-radius:2px;background:#7C3AED"></span>Onboarded</span></div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:48px"><sc-for list="{{ days }}" as="d" hint-placeholder-count="6"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end"><div style="display:flex;align-items:flex-end;gap:2px;height:36px"><div title="Planned {{ d.planned }}" style="width:10px;height:{{ d.ph }};min-height:2px;border-radius:3px 3px 0 0;background:#DDD6FE"></div><div title="Onboarded {{ d.onboarded }}" style="width:10px;height:{{ d.oh }};min-height:2px;border-radius:3px 3px 0 0;background:#7C3AED"></div></div><span style="font:{{ d.fw }} 10px/12px var(--font);color:{{ d.fc }}">{{ d.label }}</span></div></sc-for></div>
    </div>
  </div>
  <sc-if value="{{ notice }}" hint-placeholder-val="{{ false }}"><div style="flex:none;display:flex;align-items:center;gap:8px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:10px 16px;font:600 13px/20px var(--font);color:#B91C1C;animation:mdFade 200ms ease"><dc-import name="Icon" icon="alert" size="16" hint-size="16px,16px"></dc-import>{{ notice }}</div></sc-if>
  <div ref="{{ boardRef }}" style="flex:1;min-height:0;display:flex;gap:24px;overflow-x:auto;padding-bottom:6px">
    <sc-for list="{{ cols }}" as="c" hint-placeholder-count="5">
      <div data-col="{{ c.key }}" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="flex:1 1 0;min-width:216px;display:flex;flex-direction:column;min-height:0;border-radius:14px;background:{{ c.wrapBg }};outline:{{ c.outline }};outline-offset:2px;transition:background 150ms ease">
        <div style="flex:none;height:32px;display:flex;align-items:center;gap:8px;padding:0 4px"><span style="width:8px;height:8px;border-radius:50%;background:{{ c.dot }}"></span><span style="font:600 12px/16px var(--font);letter-spacing:.06em;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="{{ c.sub }}">{{ c.label }}</span><span style="min-width:22px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#F1F5F9;color:#64748B;display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 var(--font);font-variant-numeric:tabular-nums">{{ c.count }}</span><button onClick="{{ c.add }}" aria-label="Add dealer" style="margin-left:auto;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#64748B;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ c.plusOp }};transition:opacity 150ms ease" style-hover="background:#F1F5F9"><dc-import name="Icon" icon="plus" size="16" stroke="1.75" hint-size="16px,16px"></dc-import></button></div>
        <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px 8px 16px 4px">
          <sc-for list="{{ c.cards }}" as="k" hint-placeholder-count="2">
            <div onPointerDown="{{ k.down }}" style="position:relative;cursor:grab;user-select:none;opacity:{{ k.op }};transition:opacity 150ms ease;flex:none">
              <dc-import name="DCard" dealer="{{ k.dealer }}" selected="{{ k.selected }}" menuOpen="{{ k.menuOpen }}" onClick="{{ k.click }}" onMenu="{{ k.toggleMenu }}" hint-size="100%,190px"></dc-import>
              <sc-if value="{{ k.menuOpen }}" hint-placeholder-val="{{ false }}">
                <div data-nodrag="1" onClick="{{ k.toggleMenu }}" style="position:fixed;inset:0;z-index:30"></div>
                <div data-nodrag="1" style="position:absolute;top:36px;right:8px;width:220px;z-index:31;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);padding:6px;animation:mdFade 150ms ease">
                  <div style="font:600 11px/16px var(--font);letter-spacing:.06em;color:#64748B;padding:6px 10px 4px">MOVE TO</div>
                  <sc-for list="{{ k.moves }}" as="mv" hint-placeholder-count="4"><button onClick="{{ mv.go }}" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font:500 13px/20px var(--font);color:#0F172A" style-hover="background:#F5F3FF"><span style="width:8px;height:8px;border-radius:50%;background:{{ mv.dot }};flex:none"></span>{{ mv.label }}</button></sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ c.empty }}" hint-placeholder-val="{{ false }}"><button onClick="{{ c.add }}" style="align-self:flex-start;border:0;background:none;padding:6px 4px;cursor:pointer;font:500 13px/20px var(--font);color:#64748B;border-radius:8px" style-hover="color:#7C3AED">+ Add dealer</button></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
  <dc-import name="DealerPanel" hint-size="0px,0px"></dc-import>
  <dc-import name="BulkImport" hint-size="0px,0px"></dc-import>
  <sc-if value="{{ ghostOn }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;left:{{ ghostX }};top:{{ ghostY }};width:{{ ghostW }};z-index:100;pointer-events:none;transform:rotate(1deg);filter:drop-shadow(0 18px 28px rgba(15,18,32,.28));opacity:.97"><dc-import name="DCard" dealer="{{ ghostDealer }}" selected="{{ true }}" hint-size="100%,190px"></dc-import></div></sc-if>
  <sc-if value="{{ newOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeNew }}" style="position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:50;display:flex;align-items:center;justify-content:center">
      <div onClick="{{ stop }}" style="width:480px;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.3);padding:24px;display:flex;flex-direction:column;gap:12px;animation:mdFade 200ms ease">
        <div style="font:600 20px/28px var(--font)">New dealer</div>
        <sc-for list="{{ fields }}" as="f" hint-placeholder-count="7"><label style="display:flex;flex-direction:column;gap:4px;font:600 12px/16px var(--font);color:#64748B">{{ f.label }}<input value="{{ f.value }}" onChange="{{ f.change }}" placeholder="{{ f.ph }}" style="height:36px;border:1px solid #E2E8F0;border-radius:10px;padding:0 10px;font:400 14px/20px var(--font);outline:0"></label></sc-for>
        <label style="display:flex;flex-direction:column;gap:4px;font:600 12px/16px var(--font);color:#64748B">Stage<select onChange="{{ setStage }}" style="height:36px;border:1px solid #E2E8F0;border-radius:10px;padding:0 6px;font:500 13px/20px var(--font);outline:0;background:#fff"><sc-for list="{{ stageOpts }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></sc-for></select></label>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px"><button onClick="{{ closeNew }}" style="height:36px;padding:0 16px;border:1px solid #E2E8F0;border-radius:10px;background:#fff;color:#334155;font:600 14px/20px var(--font);cursor:pointer">Cancel</button><button onClick="{{ createNew }}" style="height:36px;padding:0 16px;border:0;border-radius:10px;background:#7C3AED;color:#fff;font:600 14px/20px var(--font);cursor:pointer" style-hover="background:#6D28D9">Create dealer</button></div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);font:600 13px/20px var(--font);animation:mdUp 200ms ease;white-space:nowrap;max-width:90%"><span style="width:20px;height:20px;border-radius:50%;background:{{ toastDot }};color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none"><dc-import name="Icon" icon="check" size="12" stroke="2.5" hint-size="12px,12px"></dc-import></span><span style="overflow:hidden;text-overflow:ellipsis">{{ toastText }}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  boardRef = React.createRef();
  blankNew = { name: '', branch: '', region: '', contactName: '', phone: '', email: '', salesOwner: 'Anan K.', stage: 0 };
  state = { m: null, s: null, tick: 0, drag: null, over: null, menuId: null, notice: '', hoverCol: null, nf: null };
  componentDidMount() {
    import('./store.js').then((m) => { this.m = m; this.unsub = m.store.subscribe((s) => { this.setState({ s }); if (s.newDealerReq) { const stage = s.newDealerReq.stage; m.store.clearNewDealer(); this.setState({ nf: { ...this.blankNew, stage } }); } }); this.setState({ m, s: m.store.get() }); });
    this.iv = setInterval(() => { if (!this.pd || !this.pd.active) this.setState((x) => ({ tick: x.tick + 1 })); }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.nt); this.unsub && this.unsub(); window.removeEventListener('pointermove', this.mv); window.removeEventListener('pointerup', this.up); }
  zoom() { return parseFloat(getComputedStyle(document.documentElement).zoom) || 1; }
  down(e, d) {
    if (e.button !== 0 || (e.target.closest && e.target.closest('[data-nodrag]'))) return;
    const r = e.currentTarget.getBoundingClientRect();
    this.pd = { id: d.id, sx: e.clientX, sy: e.clientY, offX: e.clientX - r.left, offY: e.clientY - r.top, w: r.width, active: false };
    window.addEventListener('pointermove', this.mv); window.addEventListener('pointerup', this.up);
  }
  mv = (e) => {
    const pd = this.pd; if (!pd) return;
    if (!pd.active) { if (Math.hypot(e.clientX - pd.sx, e.clientY - pd.sy) < 6) return; pd.active = true; }
    const el = document.elementFromPoint(e.clientX, e.clientY), col = el && el.closest ? el.closest('[data-col]') : null, b = this.boardRef.current;
    if (b) { const r = b.getBoundingClientRect(); if (e.clientX > r.right - 60) b.scrollLeft += 18; else if (e.clientX < r.left + 60) b.scrollLeft -= 18; }
    this.setState({ drag: { id: pd.id, x: e.clientX, y: e.clientY, offX: pd.offX, offY: pd.offY, w: pd.w }, over: col ? +col.dataset.col : null });
  };
  up = () => {
    window.removeEventListener('pointermove', this.mv); window.removeEventListener('pointerup', this.up);
    const pd = this.pd; this.pd = null; if (!pd || !pd.active) return;
    this.justDragged = true; setTimeout(() => { this.justDragged = false; }, 60);
    const over = this.state.over; this.setState({ drag: null, over: null });
    if (over != null) this.moveTo(pd.id, over);
  };
  setNotice(t) { clearTimeout(this.nt); this.setState({ notice: t }); this.nt = setTimeout(() => this.setState({ notice: '' }), 5000); }
  moveTo(id, target) { const r = this.m.store.moveDealer(id, target); if (!r.ok) this.setNotice(r.reason); else this.setState({ notice: '' }); }
  renderVals() {
    const { m, s, drag, over, menuId, notice, hoverCol, nf } = this.state, nop = () => {};
    const blank = { kpis: [], days: [], notice: '', boardRef: this.boardRef, cols: [], ghostOn: false, ghostX: '0px', ghostY: '0px', ghostW: '0px', ghostDealer: null, newOpen: false, closeNew: nop, stop: nop, fields: [], stageOpts: [], setStage: nop, createNew: nop, toast: false, toastText: '', toastDot: '#34C759' };
    if (!m || !s) return blank;
    const st = m.store, z = this.zoom(), vis = m.visibleDealers(s), K = m.onbKpis(s);
    const TC = ['#94A3B8', '#007AFF', '#FF9500', '#8B5CF6', '#34C759'];
    const mx = Math.max(1, ...K.days.map((d) => Math.max(d.planned, d.onboarded)));
    const cols = m.STAGES.map((label, i) => {
      const list = vis.filter((d) => d.stage === i).sort((a, b) => (i === 4 ? b.doneAt - a.doneAt : m.dealerView(a).left - m.dealerView(b).left));
      return { key: i, label: i + ' · ' + label.toUpperCase(), sub: m.STAGE_SUB[i], count: list.length, dot: TC[i], empty: list.length === 0, plusOp: hoverCol === i ? 1 : 0, enter: () => this.setState({ hoverCol: i }), leave: () => this.setState({ hoverCol: null }), add: () => st.requestNewDealer(i),
        outline: drag ? (over === i ? '2px dashed #A78BFA' : '1.5px dashed #C4B5FD') : 'none', wrapBg: drag ? (over === i ? '#EDE9FE' : '#F5F3FF') : 'transparent',
        cards: list.map((d) => ({ dealer: d, selected: s.selectedId === d.id, op: drag && drag.id === d.id ? 0.3 : 1, down: (e) => this.down(e, d), click: () => { if (!this.justDragged) st.select(s.selectedId === d.id ? null : d.id); },
          menuOpen: menuId === d.id, toggleMenu: () => this.setState({ menuId: menuId === d.id ? null : d.id }),
          moves: m.STAGES.map((x, j) => ({ label: j + ' · ' + x, dot: TC[j], j })).filter((x) => x.j !== i).map((x) => ({ label: x.label, dot: x.dot, go: () => { this.setState({ menuId: null }); this.moveTo(d.id, x.j); } })) })) };
    });
    const dd = drag && s.dealers.find((x) => x.id === drag.id);
    const set = (k) => (e) => this.setState({ nf: { ...nf, [k]: e.target.value } });
    const F = [['Dealer name', 'name', 'e.g. Phuket Phone Gallery'], ['Branch', 'branch', ''], ['Region', 'region', ''], ['Contact name', 'contactName', ''], ['Phone', 'phone', ''], ['Email', 'email', ''], ['Sales owner', 'salesOwner', '']];
    return { ...blank, notice,
      kpis: [['Dealers in progress', K.inProgress, '#0F172A'], ['Due today', K.dueToday, '#C2410C'], ['Overdue', K.overdue, K.overdue ? '#B91C1C' : '#0F172A'], ['Onboarded this week', K.weekDone, '#15803D']].map(([label, value, color]) => ({ label, value, color })),
      days: K.days.map((d) => ({ label: d.label, planned: d.planned, onboarded: d.onboarded, ph: (d.planned / mx) * 100 + '%', oh: (d.onboarded / mx) * 100 + '%', fw: d.today ? '700' : '500', fc: d.today ? '#7C3AED' : '#94A3B8' })),
      cols, ghostOn: !!dd, ghostX: dd ? (drag.x - drag.offX) / z + 'px' : '0px', ghostY: dd ? (drag.y - drag.offY) / z + 'px' : '0px', ghostW: dd ? drag.w / z + 'px' : '0px', ghostDealer: dd || null,
      newOpen: !!nf, closeNew: () => this.setState({ nf: null }), stop: (e) => e.stopPropagation(), fields: nf ? F.map(([label, k, ph]) => ({ label, ph, value: nf[k], change: set(k) })) : [],
      stageOpts: nf ? m.STAGES.map((x, i) => ({ v: String(i), l: i + ' · ' + x, sel: nf.stage === i })) : [], setStage: (e) => this.setState({ nf: { ...nf, stage: +e.target.value } }),
      createNew: () => { if (!nf.name.trim()) return st.toast('Add a dealer name first'); const id = st.createDealer({ ...nf, name: nf.name.trim() }); this.setState({ nf: null }); st.toast(id + ' created'); },
      toast: !!s.toast, toastText: s.toast ? s.toast.text : '', toastDot: '#34C759' };
  }
}
</script>
</body>
</html>
