<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;height:100%;min-height:0;background:#F8FAFC;font-family:var(--font,-apple-system,Inter,sans-serif);color:#0F172A">
  <div style="width:208px;flex:none;padding:24px 8px 24px 24px;display:flex;flex-direction:column;gap:2px">
    <div style="font:600 11px/16px var(--font);letter-spacing:.06em;color:#64748B;padding:0 12px 8px">SETTINGS</div>
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="2"><button onClick="{{ i.go }}" style="text-align:left;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font:{{ i.fw }} 14px/20px var(--font);background:{{ i.bg }};color:{{ i.fg }}" style-hover="background:#F1F5F9">{{ i.label }}</button></sc-for>
    <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}"><div style="margin:16px 12px 0;font:400 12px/16px var(--font);color:#64748B">View only. Editing is for Team Leads.</div></sc-if>
  </div>
  <div style="flex:1;min-width:0;overflow-y:auto;padding:24px 32px 48px 16px;box-sizing:border-box">
    <div style="max-width:1100px">
      <sc-if value="{{ isInt }}" hint-placeholder-val="{{ true }}"><dc-import name="SettingsIntegrations" hint-size="100%,600px"></dc-import></sc-if>
      <sc-if value="{{ isAuto }}" hint-placeholder-val="{{ false }}"><dc-import name="SettingsAutomations" hint-size="100%,600px"></dc-import></sc-if>
    </div>
  </div>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);font:600 13px/20px var(--font);white-space:nowrap"><span style="width:20px;height:20px;border-radius:50%;background:#34C759;color:#fff;display:inline-flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="check" size="12" stroke="2.5" hint-size="12px,12px"></dc-import></span>{{ toastText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { m: null, s: null };
  componentDidMount() { import('./store.js').then((m) => { this.unsub = m.store.subscribe((s) => this.setState({ s })); this.setState({ m, s: m.store.get() }); }); }
  componentWillUnmount() { this.unsub && this.unsub(); }
  renderVals() {
    const { m, s } = this.state;
    if (!m || !s) return { items: [], locked: false, isInt: true, isAuto: false, toast: false, toastText: '' };
    return { items: [['integrations', 'Integrations'], ['automations', 'Automations & SLA']].map(([k, label]) => ({ label, bg: s.settingsPage === k ? '#EDE9FE' : 'transparent', fg: s.settingsPage === k ? '#6D28D9' : '#475569', fw: s.settingsPage === k ? '600' : '500', go: () => m.store.setSettingsPage(k) })),
      locked: s.role !== 'Team Lead', isInt: s.settingsPage === 'integrations', isAuto: s.settingsPage === 'automations', toast: !!s.toast, toastText: s.toast ? s.toast.text : '' };
  }
}
</script>
</body>
</html>
