<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:{{ px }};height:{{ px }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 36 36" style="transform:rotate(-90deg);position:absolute;inset:0"><circle cx="18" cy="18" r="15" fill="none" stroke="#E2E8F0" stroke-width="3.5"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="{{ color }}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{ dash }}" style="transition:stroke-dasharray 200ms ease"></circle></svg><span style="position:relative;font:700 {{ fs }}/1 -apple-system,'SF Pro Text',Inter,sans-serif;color:{{ color }};font-variant-numeric:tabular-nums">{{ centre }}</span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;pct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:70,&quot;tsType&quot;:&quot;number&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;risk&quot;,&quot;breached&quot;,&quot;paused&quot;,&quot;done&quot;,&quot;stage&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;centre&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2h&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:36,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, s = p.size ?? 36, st = p.state ?? 'ok';
    const col = { ok: '#34C759', risk: '#FF9500', breached: '#FF3B30', paused: '#8E8E93', done: '#34C759', stage: '#7C3AED' }[st] || '#34C759';
    const C = 2 * Math.PI * 15, pct = Math.max(0, Math.min(100, p.pct ?? 100));
    return { size: s, px: s + 'px', color: col, dash: `${(C * pct) / 100} ${C}`, centre: p.centre ?? '', fs: Math.round(s * 0.28) + 'px' };
  }
}
</script>
</body>
</html>
