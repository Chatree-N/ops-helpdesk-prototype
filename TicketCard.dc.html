<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="background:#fff;border:{{ border }};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;box-shadow:{{ shadow }};font-family:-apple-system,'SF Pro Text',Inter,sans-serif;color:#0F172A;transition:box-shadow 150ms ease,border-color 150ms ease" style-hover="box-shadow:0 4px 14px rgba(15,23,42,.08)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span style="font:700 12px/16px ui-monospace,'SF Mono',Menlo,monospace;color:#64748B">#{{ id }}</span>
    <dc-import name="Pill" kind="priority" value="{{ priority }}" hint-size="64px,20px"></dc-import>
  </div>
  <div style="font-weight:700;font-size:15px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ subject }}</div>
  <div style="display:flex;align-items:center;gap:10px">
    <dc-import name="SlaRing" size="36" pct="{{ pct }}" state="{{ state }}" centre="{{ centre }}" hint-size="36px,36px"></dc-import>
    <span style="font-size:13px;line-height:20px;color:{{ labelColor }};font-weight:500;font-variant-numeric:tabular-nums">{{ label }}</span>
    <span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#334155"><dc-import name="Icon" icon="{{ chIcon }}" size="16" hint-size="16px,16px"></dc-import>{{ channel }}</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#475569">
    <span style="color:#64748B;display:inline-flex"><dc-import name="Icon" icon="user" size="16" hint-size="16px,16px"></dc-import></span>
    <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ requester }}<span style="color:#64748B">, {{ role }}</span></span>
    <span style="margin-left:auto;font-size:12px;color:#64748B;white-space:nowrap">{{ rel }}</span>
    <dc-import name="Avatar" initials="{{ ini }}" color="{{ aColor }}" size="24" hint-size="24px,24px"></dc-import>
  </div>
  <div style="height:1px;background:#F1F5F9"></div>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <dc-import name="Pill" kind="status" value="{{ status }}" hint-size="64px,20px"></dc-import>
    <dc-import name="Pill" kind="team" value="{{ team }}" hint-size="80px,20px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:260},&quot;ticket&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { m: null };
  componentDidMount() { import('./store.js').then((m) => this.setState({ m })); }
  renderVals() {
    const { m } = this.state, t = this.props.ticket;
    const sel = !!this.props.selected;
    const base = { border: sel ? '2px solid #7C3AED' : '1px solid #E2E8F0', shadow: sel ? '0 0 0 4px rgba(124,58,237,.12)' : '0 1px 2px rgba(15,23,42,.04)', onClick: this.props.onClick || (() => {}) };
    const tk = t || (m && m.SUPPORT_TICKETS[0]);
    if (!m || !tk) return { ...base, chIcon: 'mail', id: '', priority: 'Normal', subject: '', pct: 100, state: 'ok', centre: '', label: '', labelColor: '#475569', channel: '', requester: '', role: '', rel: '', ini: '', aColor: '#CBD5E1', status: 'New', team: 'Servicing' };
    const v = m.slaView(tk), a = m.agentById(tk.assignee);
    const lc = { breached: '#FF3B30', risk: '#E8590C', paused: '#8E8E93' }[v.state] || '#475569';
    const chIcon = { Email: 'mail', LINE: 'chat', Phone: 'phone', Form: 'form' }[tk.channel];
    return { ...base, chIcon, id: tk.id, priority: tk.priority, subject: tk.subject, pct: v.pct, state: v.state, centre: v.centre, label: v.label, labelColor: lc,
      channel: tk.channel, requester: tk.requester, role: tk.requesterRole, rel: m.relTime(tk.updatedAt), ini: a ? a.initials : '–', aColor: a ? a.color : '#CBD5E1', status: tk.status, team: tk.team };
  }
}
</script>
</body>
</html>
